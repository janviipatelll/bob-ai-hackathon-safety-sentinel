submission:
  title: "SafetySentinel - Drug Safety Signal Detector & Regulatory Submission Readiness Checker"
  problem_statement: >
    Pharmacovigilance teams need to identify emerging drug safety signals from
    large volumes of adverse event reports, while regulatory teams must ensure
    that complex CTD submissions are complete before filing. Manual analysis
    and checklist-based review can be time-consuming and may allow important
    safety signals or submission gaps to be overlooked.

  solution_summary: >
    SafetySentinel is an AI-assisted regulatory and pharmacovigilance tool with
    two integrated modes. Signal Detection analyzes adverse event reports,
    calculates proportional reporting ratio (PRR) and chi-square statistics,
    and flags potential safety signals. Submission Readiness checks a CTD
    dossier outline against an ICH M4-inspired checklist, scores module
    completeness, and generates a gap report. IBM Bob supports the development
    workflow through planning, implementation, debugging, and review.

  key_features:
    - "Adverse event signal detection using PRR and chi-square statistics"
    - "Automated identification of potential drug-event safety signals"
    - "CTD submission readiness assessment across Modules 1-5"
    - "Module-wise completeness scoring and missing-section gap report"
    - "IBM Bob-assisted development, debugging, testing, and code review"
